name: laravel-microservices

services:
  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: laravel-microservices-producer:local
    init: true
    volumes:
      - ./producer:/var/www/html
    ports:
      - "${PRODUCER_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: http://localhost:${PRODUCER_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${PRODUCER_DB_DATABASE:-producer}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
      args:
        WWWGROUP: ${WWWGROUP:-1000}
        WWWUSER: ${WWWUSER:-1000}
    image: laravel-microservices-consumer:local
    init: true
    volumes:
      - ./consumer:/var/www/html
    ports:
      - "${CONSUMER_PORT:-8001}:8001"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_URL: http://localhost:${CONSUMER_PORT:-8001}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${CONSUMER_DB_DATABASE:-consumer}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
    command: php artisan serve --host=0.0.0.0 --port=8001
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${PRODUCER_DB_DATABASE:-producer}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq
    ports:
      - "${FORWARD_RABBITMQ_PORT:-5672}:5672"
      - "${FORWARD_RABBITMQ_DASHBOARD_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-app}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-secret}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    profiles:
      - tools
    ports:
      - "${FORWARD_PHPMYADMIN_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 300M
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  rabbitmq-data:
